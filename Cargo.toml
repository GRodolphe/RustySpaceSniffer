[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roro/RustySpaceSniffer"

# Release profile per SPEC.md §3 (binary size budget) and §11.2.
[profile.release]
lto = true
opt-level = "z"
strip = true
