[package]
name = "rss-watch"
description = "Live filesystem change watchers (SPEC.md §5.5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notify = "8"
crossbeam-channel = "0.5"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
