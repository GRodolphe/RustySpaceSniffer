[package]
name = "rss-cli"
description = "Headless command-line front-end (SPEC.md §4.9; GUI dispatch arrives with rss-app in M2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rss"
path = "src/main.rs"

[dependencies]
rss-core = { path = "../rss-core" }
rss-scan = { path = "../rss-scan" }
rss-export = { path = "../rss-export" }
rss-filter = { path = "../rss-filter" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

# Ground-truth hardlink identity needs GetFileInformationByHandle; std does
# not expose a stable file-index API on Windows.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
